name: Build Klewi Desktop and KCMODULE packages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/KlewiDesktop/KlewiDesktop.csproj
      - name: Build
        run: dotnet build src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --no-restore
      - name: Publish Klewi Desktop
        run: dotnet publish src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/KlewiDesktop
      - name: Package KCMODULE files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/modules | Out-Null
          Compress-Archive -Path modules/MinecraftStudio/* -DestinationPath artifacts/modules/Klewi-MinecraftStudio.zip -Force
          Move-Item artifacts/modules/Klewi-MinecraftStudio.zip artifacts/modules/Klewi-MinecraftStudio.kcmodule -Force
          Compress-Archive -Path modules/IsoTools/* -DestinationPath artifacts/modules/Klewi-IsoTools.zip -Force
          Move-Item artifacts/modules/Klewi-IsoTools.zip artifacts/modules/Klewi-IsoTools.kcmodule -Force
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Klewi-Windows-Build
          path: |
            artifacts/KlewiDesktop/
            artifacts/modules/*.kcmodule
          if-no-files-found: error
