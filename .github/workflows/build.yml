name: Build Klewi Desktop
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/KlewiDesktop/KlewiDesktop.csproj
      - name: Build
        run: dotnet build src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --no-restore
      - name: Publish self-contained Windows app
        run: dotnet publish src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/KlewiDesktop
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlewiDesktop-win-x64
          path: artifacts/KlewiDesktop/
          if-no-files-found: error
