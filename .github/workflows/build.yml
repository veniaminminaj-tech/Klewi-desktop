name: Build Klewi Code installer and KCMODULE packages
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Restore
        run: dotnet restore src/KlewiDesktop/KlewiDesktop.csproj
      - name: Build
        run: dotnet build src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --no-restore
      - name: Publish Klewi Code
        run: dotnet publish src/KlewiDesktop/KlewiDesktop.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output artifacts/KlewiCode
      - name: Package all KCMODULE files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/modules | Out-Null
          $moduleDirs = Get-ChildItem modules -Directory
          if ($moduleDirs.Count -ne 25) { throw "Expected exactly 25 KCMODULE modules, found $($moduleDirs.Count)." }
          foreach ($module in $moduleDirs) {
            $manifestPath = Join-Path $module.FullName "manifest.json"
            if (!(Test-Path $manifestPath)) { throw "Missing manifest: $manifestPath" }
            $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
            if ($manifest.format -ne "kcmodule" -or !$manifest.id -or !$manifest.name -or !$manifest.version) {
              throw "Invalid KCMODULE manifest: $manifestPath"
            }
            $zipPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/modules/$($module.Name).zip"
            $packagePath = Join-Path $env:GITHUB_WORKSPACE "artifacts/modules/$($module.Name).kcmodule"
            Compress-Archive -Path (Join-Path $module.FullName "*") -DestinationPath $zipPath -Force
            Move-Item $zipPath $packagePath -Force
          }
      - name: Build single installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\\Inno Setup 6\\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "/DSourceDir=$pwd\\artifacts\\KlewiCode" "/DModuleDir=$pwd\\artifacts\\modules" installers/KlewiCode.iss
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Klewi-Code-Installer
          path: artifacts/installer/Klewi-Code-Setup.exe
          if-no-files-found: error
